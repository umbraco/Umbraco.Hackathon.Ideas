name: Refresh IDEAS.md

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, assigned, unassigned]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: refresh-ideas
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate IDEAS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/regenerate-ideas.sh

      - name: Commit if changed
        run: |
          if git diff --quiet -- IDEAS.md; then
            echo "No changes to IDEAS.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IDEAS.md
          git commit -m "Refresh IDEAS.md from issues"
          git push
